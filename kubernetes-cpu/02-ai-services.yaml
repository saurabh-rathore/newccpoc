        image: ai-tts-service
        ports:
        - containerPort: 8003
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tts-service
  namespace: ai-call-center
spec:
  selector:
    app: tts-service
  ports:
  - protocol: TCP
    port: 8003
    targetPort: 8003
