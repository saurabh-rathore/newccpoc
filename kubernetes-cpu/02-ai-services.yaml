# --- Speech-to-Text Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-service
  namespace: ai-call-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stt-service
  template:
    metadata:
      labels:
        app: stt-service
    spec:
      containers:
      - name: stt-service
        image: ai-stt-service
        ports:
        - containerPort: 8001
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "1"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: stt-service
  namespace: ai-call-center
spec:
  selector:
    app: stt-service
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001

# --- Language Model Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
  namespace: ai-call-center
spec:
  replicas: 1 # This model is large, start with one and scale carefully
  selector:
    matchLabels:
      app: llm-service
  template:
    metadata:
      labels:
        app: llm-service
    spec:
      containers:
      - name: llm-service
        image: ai-llm-service
        ports:
        - containerPort: 8002
        env:
        - name: QDRANT_URL
          value: "http://<your_external_qdrant_url>:6333"
        resources:
          limits:
            cpu: "4"
            memory: "16Gi" # LLMs are memory intensive
          requests:
            cpu: "2"
            memory: "8Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: ai-call-center
spec:
  selector:
    app: llm-service
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002

# --- Text-to-Speech Service ---
