# On-Premise Networking Configuration using MetalLB
# This manifest should be used in place of the cloud-specific `04-loadbalancers.yaml`
# for on-premise Kubernetes deployments.
#
# It assumes you have already installed and configured MetalLB on your cluster
# with an IP address pool.

# --- SIP Load Balancer for Asterisk ---
# This service uses MetalLB to expose the Asterisk SIP port (5060/UDP)
# to your local network.
apiVersion: v1
kind: Service
metadata:
  name: asterisk-loadbalancer
  namespace: ai-call-center
spec:
  type: LoadBalancer
  selector:
    app: asterisk
  ports:
  - name: sip-udp
    port: 5060
    protocol: UDP
    targetPort: 5060

---
# --- WebSocket Load Balancer for AI Voice Gateway ---
# This service uses MetalLB to expose the AI Voice Gateway's media WebSocket
# endpoint to your local network, so Asterisk can stream media to it.
apiVersion: v1
kind: Service
metadata:
  name: gateway-loadbalancer
  namespace: ai-call-center
spec:
  type: LoadBalancer
  selector:
    app: ai-voice-gateway
  ports:
  - name: media-ws
    port: 80
    protocol: TCP
    targetPort: 8000
