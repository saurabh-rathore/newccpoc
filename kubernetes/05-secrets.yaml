apiVersion: v1
kind: Secret
metadata:
  name: external-db-secrets
  namespace: ai-call-center
type: Opaque
stringData:
  # --- Managed MySQL (e.g., AWS RDS) ---
  MYSQL_HOST: "<your-rds-endpoint>" # e.g., your-database.random-chars.region.rds.amazonaws.com
  MYSQL_USER: "admin"
  MYSQL_PASSWORD: "<your-rds-password>"
  MYSQL_DATABASE: "call_center"

  # --- Asterisk ARI Secrets ---
  # These are for the gateway to connect to Asterisk's API
  ARI_USER: "ari_user"
  ARI_PASSWORD: "your_strong_ari_password"
