[general]
static=yes
writeprotect=no

[default]
; Default context for incoming calls

[from-external]
; Context for calls from external sources (e.g., SIP trunk)
exten => _.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
    same => n,Answer()
    same => n,Stasis(ai-call-center,dialed)
    same => n,Hangup()

[human-agent-queue-context]
exten => human-queue,1,NoOp(Transferring call to human agent queue)
    same => n,Queue(support_queue,t)
    same => n,Hangup()
