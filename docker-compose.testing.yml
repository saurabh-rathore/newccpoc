version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_call_center_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    networks:
      - ai_call_center_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ai_call_center_net
    ports:
      - "6333:6333" # For REST API
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  stt-service:
    build:
      context: ./stt-service
      dockerfile: Dockerfile.cpu
    image: ai-stt-service:latest
    container_name: stt-service
    networks:
      - ai_call_center_net
    depends_on:
      - redis

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile.cpu
    image: ai-llm-service:latest
    container_name: llm-service
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
    networks:
      - ai_call_center_net
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  tts-service:
    build:
      context: ./tts-service
      dockerfile: Dockerfile
    image: ai-tts-service:latest
    container_name: tts-service
    networks:
      - ai_call_center_net

  ai-voice-gateway:
    build:
      context: ./ai-voice-gateway
      dockerfile: Dockerfile
    image: ai-voice-gateway:latest
    container_name: ai-voice-gateway
    environment:
      - STT_WS_URL=ws://stt-service:8001/ws/stt
      - LLM_API_URL=http://llm-service:8002/generate
      - TTS_WS_URL=ws://tts-service:8003/ws/tts
      - ARI_URL=http://asterisk:8088
      - ARI_USER=${ASTERISK_USER}
      - ARI_PASSWORD=${ASTERISK_PASSWORD}
    networks:
      - ai_call_center_net
    ports:
      - "8000:8000"
    depends_on:
      - stt-service
      - llm-service
      - tts-service
      - asterisk

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    container_name: asterisk
    environment:
      - ASTERISK_ARI_USER=${ASTERISK_USER}
      - ASTERISK_ARI_PASSWORD=${ASTERISK_PASSWORD}
    ports:
      - "8088:8088" # ARI
      - "5060:5060/udp" # SIP
      - "10000-10020:10000-10020/udp" # RTP
    networks:
      - ai_call_center_net

volumes:
  postgres_data:
  qdrant_data:

networks:
  ai_call_center_net:
    driver: bridge
