version: '3.8'

services:
  # --- INFRASTRUCTURE ---

  asterisk:
    image: asterisk:20
    container_name: asterisk
    ports:
      - "5060:5060/udp"      # PJSIP UDP Port
      - "8088:8088"          # ARI HTTP Port
      - "10000-10100:10000-10100/udp" # RTP Ports
    volumes:
      - ./asterisk/config:/etc/asterisk
    environment:
      - PUID=1000
      - PGID=1000
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-call_center}
      MYSQL_USER: ${MYSQL_USER:-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    restart: unless-stopped

  redis:
    image: redis:6-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --- AI SERVICES ---

  ai-voice-gateway:
    build: ./ai-voice-gateway
    container_name: ai-voice-gateway
    ports:
      - "8000:8000"
    depends_on:
      - asterisk
      - mysql
      - qdrant
      - rabbitmq
      - redis
    environment:
      - ARI_URL=http://asterisk:8088/
      - ARI_USER=${ARI_USER}
      - ARI_PASSWORD=${ARI_PASSWORD}
    restart: unless-stopped

  stt-service:
    build: ./stt-service
    container_name: stt-service
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  llm-service:
    build: ./llm-service
    container_name: llm-service
    ports:
      - "8002:8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  tts-service:
    build: ./tts-service
    container_name: tts-service
    ports:
      - "8003:8003"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_storage:
